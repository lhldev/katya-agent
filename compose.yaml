services:
  hermes-desktop:
    build: .
    image: hermes-desktop-telegram:latest
    container_name: hermes-desktop
    restart: unless-stopped
    # Host networking lets the gateway reach OmniRoute on 127.0.0.1:20128
    # directly, with no socat bridge and no container-to-host firewall hole.
    # UFW's default INPUT policy is DROP, so the dashboard/VNC stay off the
    # LAN and remain reachable on 127.0.0.1.
    network_mode: host
    environment:
      - HERMES_USER=${HERMES_USER}
      - HERMES_PASSWORD=${HERMES_PASSWORD}
    volumes:
      - hermes_home_data:/home/${HERMES_USER}
      - ./.env:/tmp/.env:ro
      - ./config.yaml:/tmp/config.yaml:ro
    entrypoint: >
      /bin/sh -c "
      cp -rn /etc/skel/. /home/${HERMES_USER}/ 2>/dev/null || true;
      chown -R 1000:1000 /home/${HERMES_USER};
      chmod 755 /home/${HERMES_USER};
      mkdir -p /home/${HERMES_USER}/.hermes;
      cp /tmp/.env /home/${HERMES_USER}/.hermes/.env 2>/dev/null || true;
      cp /tmp/config.yaml /home/${HERMES_USER}/.hermes/config.yaml 2>/dev/null || true;
      chown -R 1000:1000 /home/${HERMES_USER}/.hermes;
      /entrypoint.sh &
      sleep 5;
      set -a; . /home/${HERMES_USER}/.hermes/.env; set +a;
      exec hermes gateway run
      "
    command: ""
volumes:
  hermes_home_data:
