services:
  omniroute-init:
    image: alpine:latest
    container_name: omniroute-init
    network_mode: host
    privileged: true
    restart: unless-stopped
    entrypoint: >
      /bin/sh -c "
      until command -v iptables >/dev/null 2>&1; do
        apk add --no-cache iptables iptables-legacy || sleep 2;
      done;
      sysctl -w net.ipv4.conf.docker0.route_localnet=1;
      for IPT in iptables iptables-legacy; do
        if command -v $$IPT >/dev/null 2>&1; then
          $$IPT -t nat -C PREROUTING -i docker0 -p tcp --dport 20128 -j DNAT --to-destination 127.0.0.1:20128 2>/dev/null ||
          $$IPT -t nat -A PREROUTING -i docker0 -p tcp --dport 20128 -j DNAT --to-destination 127.0.0.1:20128;
          $$IPT -C INPUT -i docker0 -d 127.0.0.0/8 -p tcp --dport 20128 -j ACCEPT 2>/dev/null ||
          $$IPT -I INPUT 1 -i docker0 -d 127.0.0.0/8 -p tcp --dport 20128 -j ACCEPT;
          $$IPT -C INPUT -i docker0 -d 127.0.0.0/8 -j DROP 2>/dev/null ||
          $$IPT -I INPUT 2 -i docker0 -d 127.0.0.0/8 -j DROP;
        fi;
      done;
      echo 'Omniroute bridge configured on host. Idling for reboot persistence...' &&
      exec sleep infinity
      "

  hermes-desktop:
    build: .
    image: hermes-desktop-telegram:latest
    container_name: hermes-desktop
    restart: unless-stopped
    network_mode: bridge # To make sure the interface is always docker0 for the setup script
    environment:
      - HERMES_USER=${HERMES_USER}
      - HERMES_PASSWORD=${HERMES_PASSWORD}
      - TELEGRAM_ALLOWED_USERS=${TELEGRAM_ALLOWED_USERS}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
    ports:
      - "127.0.0.1:6080:6080"   # NoVNC (web desktop)
      - "127.0.0.1:5901:5901"   # VNC
      - "127.0.0.1:3390:3389"   # RDP (host 3390 -> container 3389)
      - "127.0.0.1:9119:9119"   # Dashboard
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - hermes_home_data:/home/${HERMES_USER}
      - ./.env:/tmp/.env:ro
      - ./config.yaml:/tmp/config.yaml:ro
    entrypoint: >
      /bin/sh -c "
      cp -rn /etc/skel/. /home/${HERMES_USER}/ 2>/dev/null || true;
      mkdir -p /home/${HERMES_USER}/.hermes;
      cp /tmp/.env /home/${HERMES_USER}/.hermes/.env 2>/dev/null || true;
      chmod 400 /home/${HERMES_USER}/.hermes/.env;
      cp -n /tmp/config.yaml /home/${HERMES_USER}/.hermes/config.yaml 2>/dev/null || true;
      chown -R ${HERMES_USER}:${HERMES_USER} /home/${HERMES_USER};
      chmod 755 /home/${HERMES_USER};
      /entrypoint.sh &
      sleep 5;
      export HOME=/home/${HERMES_USER};
      exec su - ${HERMES_USER} -c 'hermes gateway run'
      "
    command: ""
volumes:
  hermes_home_data:
