services:
  hermes-desktop:
    build: .
    image: hermes-desktop-telegram:latest
    container_name: hermes-desktop
    restart: unless-stopped
    environment:
      - HERMES_USER=${HERMES_USER}
      - HERMES_PASSWORD=${HERMES_PASSWORD}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:6080:6080"
      - "127.0.0.1:9119:9119"
    volumes:
      - ./data:/home/${HERMES_USER}/.hermes

  omniroute-bridge:
    image: alpine/socat
    container_name: omniroute-bridge
    restart: unless-stopped
    network_mode: host
    # host.docker.internal resolves to the host's docker0 IP (172.17.0.1),
    # not the compose bridge IP, so listen there.
    command: TCP-LISTEN:20129,bind=172.17.0.1,fork,reuseaddr TCP:127.0.0.1:20128
