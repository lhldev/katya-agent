services:
  hermes-desktop:
    build: .
    image: hermes-desktop-telegram:latest
    container_name: hermes-desktop
    restart: unless-stopped
    # Host networking lets the gateway reach OmniRoute on 127.0.0.1:20128
    # directly, with no socat bridge and no container-to-host firewall hole.
    # UFW's default INPUT policy is DROP, so the dashboard/VNC stay off the
    # LAN and remain reachable on 127.0.0.1.
    network_mode: host
    environment:
      - HERMES_USER=${HERMES_USER}
      - HERMES_PASSWORD=${HERMES_PASSWORD}
    volumes:
      - ./data:/home/${HERMES_USER}/.hermes
