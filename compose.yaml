services:
  hermes-desktop:
    image: neoplanetz/hermes-desktop-docker:latest
    container_name: hermes-desktop
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:6080:6080"
      - "127.0.0.1:9119:9119"
    volumes:
      - ./data:/home/lhl/.hermes

  hermes-gateway:
    image: nousresearch/hermes-agent:0.17.0
    container_name: hermes-gateway
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/root/.hermes
    command: gateway run
